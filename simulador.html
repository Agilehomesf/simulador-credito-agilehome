<title>Agile Match</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>

/* Marca Agile Home: azul indigo, naranja y gris oscuro del logo. Fondo blanco, logo arriba y pasos con contenido debajo. */
:root{
  --orange:#FF6A0A; --orange-ink:#C23A00; --on-orange:#12006B; --gray:#4A4B50;
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#2B2C31; --ink-soft:#5B5C66; --head:#1A00A8;
  --line:#DDDBEA; --field:#FFFFFF; --hero:#1A00A8;
  --sel-bg:#1A00A8; --sel-fg:#FFFFFF; --seg:#F1EFF8;
  --tint-navy:#E8E4FA; --tint-orange:#FFE9DB; --tint-gray:#E9E9EC;
  --good:#17704A; --good-bg:#E0F2E9; --bad:#A92E1B; --bad-bg:#FBE8E3;
  color-scheme:light;
  --font-display:'Poppins','Segoe UI',system-ui,sans-serif;
  --font-body:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.num,.cuota strong,dd{font-variant-numeric:tabular-nums}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#FFFFFF;border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;padding-block:8px}
.topbar img{height:42px;width:auto;max-width:100%;display:block}
.logo-fb{font-family:var(--font-display);font-size:24px;color:var(--head)}
.logo-fb span{color:var(--orange)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#FFFFFF}
.hero{background:#FFFFFF;color:var(--ink);padding-block:24px 28px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--orange-ink)}
.hero h1{font-size:clamp(32px,6.5vw,50px);line-height:1.05;font-weight:700;margin-top:8px;color:var(--head);letter-spacing:-.01em}
.hero h1 span{color:var(--orange)}
.brand{display:inline-flex;margin-bottom:18px}
.brand img{height:52px;width:auto;max-width:100%;display:block}
.hero .wrap>p{margin:12px 0 0;max-width:56ch;color:var(--ink-soft)}
#owner{margin-top:18px;color:var(--ink)}
#owner:empty{display:none}
.chip{display:inline-block;margin-top:16px;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;background:var(--tint-navy);color:var(--head)}
.chip.warn{background:var(--orange);color:var(--on-orange)}

.main{padding-block:0 40px;display:grid;gap:28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.formcard{position:relative}
.grid-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 12px}
.field{min-width:0;display:grid;gap:6px;align-content:start}
.field label{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.field small{color:var(--ink-soft);font-size:12px}
.inwrap{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:9px;background:var(--field);padding:0 12px}
.inwrap:focus-within{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,106,10,.28)}
.inwrap input{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-size:17px;font-weight:600;padding:10px 0;outline:none;font-variant-numeric:tabular-nums}
.inwrap i{font-style:normal;color:var(--ink-soft);font-weight:600}
.inwrap select{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-size:15px;font-weight:600;padding:11px 0;outline:none}
.inwrap option{color:var(--ink);background:var(--surface)}
.alertline{display:block;color:var(--bad);font-weight:600;font-size:13px;margin-top:4px}
.ownerbar .chk{margin-top:8px}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:14px;color:var(--ink)}
.chk input{margin-top:3px;width:18px;height:18px;accent-color:var(--orange);flex:none}
.capline{margin:14px 0 0;padding:12px 14px;border-radius:10px;background:var(--tint-navy);color:var(--ink);font-size:14px}
.capline b{font-variant-numeric:tabular-nums}
.warnline{color:var(--bad);font-weight:600;margin:10px 0 0;font-size:14px}

h2.sec{font-size:22px;color:var(--head);margin-bottom:12px}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px;background:var(--seg);padding:5px;border-radius:12px}
.seg button{border:0;border-radius:8px;background:transparent;color:var(--ink);padding:9px 4px;display:grid;gap:1px;text-align:center;min-width:0}
.seg button b{font-size:14px;line-height:1.2}
.seg button span{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-fg)}
.seg button[aria-pressed="true"] span{color:inherit;opacity:.85}
.bestline{margin:14px 0;font-size:14.5px;color:var(--ink-soft)}
.bestline b{color:var(--head)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr));gap:12px}

.res{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0;align-content:start}
.res-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.res-top h3{font-size:19px;color:var(--head);line-height:1.2}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
.p-pesos{background:var(--tint-navy);color:var(--head)}
.p-uvr{background:var(--tint-orange);color:var(--orange-ink)}
.p-leasing{background:var(--tint-gray);color:var(--ink)}
.p-libre{border:1.5px solid var(--head);color:var(--head);padding:1px 9px}
.p-cartera{background:var(--line);color:var(--head)}
.cart{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line);display:grid;gap:12px}
.cart h3{font-size:17px;color:var(--head)}
.hint{margin:0;font-size:13px;color:var(--ink-soft)}
.link{border:0;background:none;color:var(--orange-ink);font-weight:700;text-decoration:underline;padding:0;font-size:13px}
.best{background:var(--orange);color:var(--on-orange)}
.status{flex:none;padding:4px 10px;border-radius:8px;font-size:12.5px;font-weight:700;text-align:center}
.status.ok{background:var(--good-bg);color:var(--good)}
.status.no{background:var(--bad-bg);color:var(--bad)}
.cuota .lbl{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.cuota strong{font-family:var(--font-display);font-size:32px;line-height:1.1;color:var(--head)}
.mets{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:0}
.mets div{min-width:0}
.mets dt{font-size:12px;color:var(--ink-soft)}
.mets dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.note{margin:0;font-size:13px;color:var(--ink-soft)}
.note.alert{color:var(--bad)}

.ownerbar{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:space-between;align-items:center;border:1.5px dashed var(--orange);border-radius:12px;padding:12px 16px;background:var(--surface)}
.ownerbar span{display:block;font-size:13px;color:var(--ink-soft)}
.btn{border:0;border-radius:9px;padding:10px 18px;font-weight:700;background:var(--orange);color:var(--on-orange)}
.btn.ghost{background:var(--tint-navy);color:var(--head)}
.panel{margin-top:12px;display:grid;gap:18px}
.panel h3{font-size:18px;color:var(--head);margin-bottom:10px}
.grid-p{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.bank-edit{border:1px solid var(--line);border-radius:10px;padding:0 14px;margin-bottom:8px}
.bank-edit summary{cursor:pointer;font-weight:700;padding:12px 0;color:var(--head)}
.bank-edit .grid-p{padding-bottom:14px}
fieldset.prod{border:1px solid var(--line);border-radius:10px;margin:0;padding:10px 12px 12px;display:grid;gap:10px;min-width:0}
fieldset.prod legend{font-weight:700;padding:0 6px;color:var(--head)}
.savebar{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.msg{font-size:14px;color:var(--ink-soft)}

.legal{border-top:1px solid var(--line);padding-top:20px;display:grid;gap:10px;font-size:13px;color:var(--ink-soft)}
.legal p{margin:0;max-width:75ch}
.adv{color:var(--ink);font-size:14px}
.adv b{color:var(--head)}
.steps{margin-top:28px;position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 10px 30px rgba(26,0,168,.16)}
.steps button{border:0;border-radius:9px;background:transparent;color:var(--ink);padding:10px 10px;display:flex;align-items:center;gap:10px;text-align:left;min-width:0;font-weight:700;font-size:14px;line-height:1.2}
.steps .n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--tint-navy);color:var(--head);font-size:13px}
.steps button[aria-current="step"]{background:var(--sel-bg);color:var(--sel-fg)}
.steps button[aria-current="step"] .n{background:var(--on-orange);color:#fff}
.pane{display:grid;gap:28px}
.q{display:grid;gap:8px;margin-top:18px}
.qlabel{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:8px}
.opt{position:relative;display:block;min-width:0}
.opt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.opt span{display:grid;gap:2px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--field);height:100%}
.opt b{font-size:14.5px;color:var(--head)}
.opt small{font-size:12px;color:var(--ink-soft)}
.opt input:checked+span{border-color:var(--orange);background:var(--tint-orange)}
.opt input:focus-visible+span{outline:3px solid var(--orange);outline-offset:2px}
.sumline,.profline{margin:16px 0 0;padding:12px 14px;border-radius:10px;background:var(--tint-navy);font-size:14px}
.profline{margin:0 0 16px}
h3.sub{font-size:19px;color:var(--head);margin:24px 0 10px}
.elig{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.eb{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px;min-width:0;align-content:start}
.eb-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.eb h4{margin:0;font-family:var(--font-display);font-size:17px;color:var(--head)}
.eb .note{font-size:12.5px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.docs{display:grid;gap:18px;margin-top:16px}
.dg h3{font-size:17px;color:var(--head);margin-bottom:8px}
.dg ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.dg label{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.dg input{margin-top:3px;width:17px;height:17px;accent-color:var(--orange);flex:none}
.copybox{width:100%;min-height:140px;margin-top:12px;border:1.5px solid var(--line);border-radius:9px;background:var(--field);color:var(--ink);font:inherit;font-size:13px;padding:10px}
.hero .wrap>p.tag{font-family:var(--font-display);font-size:clamp(18px,3.6vw,24px);font-weight:600;color:var(--ink);margin-top:8px;max-width:none}
.status.adj{background:var(--tint-orange);color:var(--orange-ink)}
.adjnote{background:var(--tint-orange);border-radius:8px;padding:8px 10px;color:var(--ink)}
.adjnote b{color:var(--orange-ink)}
@media (max-width:560px){.steps button{flex-direction:column;gap:4px;text-align:center;font-size:12.5px;padding:8px 4px}}
@media (min-width:640px){.cuota strong{font-size:36px}}
@media (prefers-reduced-motion:no-preference){.seg button{transition:background .15s}}

.tw{overflow-x:auto;margin-top:8px}
[hidden]{display:none!important}

.list,.elig{display:grid;grid-auto-flow:column;grid-auto-columns:min(88%,380px);grid-template-columns:none;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;align-items:start;padding:2px 2px 12px;-webkit-overflow-scrolling:touch}
.list>*,.elig>*{scroll-snap-align:start;min-width:0}
.swipe{margin:6px 0 0;font-size:12.5px;color:var(--ink-soft)}
@media (min-width:900px){.list,.elig{grid-auto-flow:row;grid-auto-columns:auto;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));overflow:visible}.swipe{display:none}}
.conv{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--tint-orange);font-size:13.5px}.conv:empty{display:none}.sumh{margin:14px 0 4px;font-size:15px;color:var(--head)}
.rk{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--orange);color:#fff;font-size:14px;margin-right:8px;vertical-align:middle}
details.more{border-top:1px dashed var(--line);padding-top:6px}details.more>summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--head);padding:6px 0;list-style:none}details.more>summary::before{content:'+ ';color:var(--orange)}details.more[open]>summary::before{content:'– '}details.more>summary::-webkit-details-marker{display:none}
details.more .note{margin:6px 0}
.capline details.more{border-top:0;padding-top:0}
.sumry{margin-top:18px}.sumt td small{display:block;color:var(--ink-soft);font-size:11.5px;font-weight:400}.sumt td{vertical-align:top}
.po{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}.po:first-of-type{border-top:0;padding-top:0}
.altb{background:var(--tint-orange);border-radius:12px;padding:12px!important;border-top:0!important}.pill.camp{background:var(--orange);color:#fff}
.po-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.po-top .status{margin-left:auto}
.fig{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:0}.fig div{min-width:0}.fig dt{font-size:12px;color:var(--ink-soft);font-weight:700}.fig dd{margin:0;font-size:15px;font-variant-numeric:tabular-nums}
.fig .big dd{font-size:18px;font-weight:700;color:var(--head)}.fig .adjv dd{color:var(--orange-ink);font-weight:700}.fig .wide{grid-column:1/-1}
.tt{width:100%;border-collapse:collapse;font-size:14px}
.tt th{text-align:left;font-size:12px;color:var(--ink-soft);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
.tt td{padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tt tr.bestrow td{background:var(--tint-orange);font-weight:700}
.tt tr.off td{color:var(--ink-soft);font-size:13px}
.tt td.adjv{color:var(--orange-ink);font-weight:700}
.tt.cost tr.tot td{font-weight:700;background:var(--tint-navy);color:var(--head)}
.rate{margin:10px 0 0;color:var(--ink-soft)}
.steps-list{margin:10px 0 0;padding:0;list-style:none;counter-reset:s}
.steps-list li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.steps-list li::before{content:counter(s);grid-row:span 2;width:28px;height:28px;border-radius:50%;background:var(--head);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.steps-list span{color:var(--ink-soft);font-size:14px}
.faq details{border:1px solid var(--line);border-radius:10px;margin-top:8px;padding:0 12px;background:#fff}
.faq summary{cursor:pointer;padding:12px 0;font-weight:700;color:var(--head)}
.faq p{margin:0 0 12px;color:var(--ink-soft)}
.bul{margin:8px 0 0;padding-left:20px;color:var(--ink-soft)}
.bul li{margin:4px 0}
.tagbase{font-size:11px;font-weight:700;background:var(--tint-gray);color:var(--gray);border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
select{max-width:100%}
.steps button{font-size:12px}

/* ===== Capa visual Agile Match: mismos colores de marca, más profundidad e iconografía ===== */
:root{--head:#2E2F35;--hero:#2E2F35;--sel-bg:#2E2F35;--tint-navy:#F0EDE9;--line:#E7E2DC;--seg:#F3F0EC;--on-orange:#FFFFFF;--bg:#F7F5F2;--shadow-s:0 1px 2px rgba(46,36,28,.06),0 4px 14px rgba(46,36,28,.07);--shadow-m:0 2px 4px rgba(46,36,28,.06),0 14px 36px rgba(46,36,28,.12);--r:18px;--indigo-2:#4A4B50;--indigo-3:#6A6B72;--orange-soft:#FFB27A}
body{background:var(--bg)}
.i{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
.topbar{background:#fff;border-bottom:0;box-shadow:0 1px 0 var(--line),0 6px 20px rgba(46,36,28,.06)}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#1E1F23 0%,var(--head) 38%,var(--indigo-2) 100%);color:#fff;border-bottom:0;padding-block:30px 64px}
.hero-art{position:absolute;inset:0;color:#fff;pointer-events:none}
.hero-art svg{position:absolute;right:0;top:0;height:100%;width:min(70%,640px);opacity:.5}
@media (max-width:700px){.hero-art svg{opacity:.18;width:100%}}
.hero::after{content:"";position:absolute;left:-60px;bottom:-90px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,106,10,.45),rgba(255,106,10,0) 70%)}
.hero .wrap{position:relative;z-index:1}
.hero .eyebrow{color:var(--orange-soft)}
.hero h1{color:#fff;font-size:clamp(38px,8vw,60px)}
.hero h1 span{color:var(--orange)}
.hero .wrap>p.tag{color:#fff}
.hero .wrap>p{color:#D9D3FF}
.feats{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.feats li{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);font-size:13px;font-weight:600;color:#fff;backdrop-filter:blur(4px)}
.feats .i{color:var(--orange-soft)}
.hero .chip{background:var(--orange);color:#fff;box-shadow:0 6px 18px rgba(255,106,10,.35)}
.hero .chip.warn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);box-shadow:none}
.main{margin-top:-40px;position:relative;z-index:2;gap:22px}
.steps{margin-top:0;border:0;border-radius:var(--r);box-shadow:var(--shadow-m);padding:8px}
.steps button{border-radius:12px;transition:background .2s,color .2s}
.steps .n{width:34px;height:34px;background:var(--tint-navy);color:var(--head);font-size:17px}
.steps button[aria-current="step"]{background:linear-gradient(135deg,var(--head),var(--indigo-2));box-shadow:0 6px 16px rgba(46,36,28,.35)}
.steps button[aria-current="step"] .n{background:var(--orange);color:#fff}
.card{border:0;border-radius:var(--r);box-shadow:var(--shadow-s);padding:24px}
@media (min-width:700px){.card{padding:32px}}
h2.sec{display:flex;align-items:center;gap:12px;font-size:24px}
.hic{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--tint-navy),#fff);border:1px solid var(--line);color:var(--head);font-size:21px;flex:none}
.hic .i{width:22px;height:22px}
.qlabel{font-size:12px;color:var(--head);display:flex;align-items:center;gap:8px}
.qlabel::after{content:"";flex:1;height:1px;background:var(--line)}
.opts{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.opt span{grid-template-columns:44px 1fr;grid-template-rows:auto auto;column-gap:12px;row-gap:0;align-items:center;border-radius:14px;padding:12px;box-shadow:0 1px 2px rgba(46,36,28,.04);transition:border-color .15s,box-shadow .15s,background .15s,transform .15s}
.opt .ic{grid-row:span 2;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--tint-navy);color:var(--head);font-style:normal;transition:background .15s,color .15s}
.opt .ic .i{width:22px;height:22px}

body{background:

 background-size:24px 24px,96px 96px;-webkit-mask-image:linear-gradient(110deg,transparent 30%,#000 90%);mask-image:linear-gradient(110deg,transparent 30%,#000 90%)}

 background:radial-gradient(circle at 30% 70%,rgba(253,76,11,.10),transparent 60%),radial-gradient(rgba(2,14,46,.18) 1px,transparent 1.5px) 0 0/16px 16px;-webkit-mask-image:radial-gradient(circle at 70% 30%,#000,transparent 70%);mask-image:radial-gradient(circle at 70% 30%,#000,transparent 70%)}

de resultados de los últimos 3 años y al corte actual", "Carta de contador público con el porcentaje accionario, si se reparten utilidades y con qué periodicidad, y si es empleado de la empresa", "Si es empleado de la empresa: certificación laboral", "Declaración de renta de los dos últimos años de la empresa y la del cliente", "Certificado de Cámara de Comercio (60 días)", "Extractos bancarios de los últimos 6 meses"], "trans": ["Certificación de la empresa donde tiene afiliado el vehículo (30 días): datos de la empresa, tiempo de permanencia, ingreso mensual, placa y datos del propietario", "Tarjeta de propiedad del vehículo; si la propiedad es compartida, certificado de tradición y libertad del vehículo", "Contrato de leasing, si el vehículo está en leasing con una entidad bancaria", "Extractos bancarios de los últimos 6 meses", "Transporte escolar, de carga o particular de pasajeros: contratos vigentes", "Declaración de renta o oficio de no declarante"]}}}, "legal": {"base": {"inmueble_usado": ["Certificado de tradición y libertad (no mayor a 30 días)", "Escritura pública de adquisición del vendedor", "Paz y salvo de predial y valorización", "Paz y salvo de administración (propiedad horizontal)", "Reglamento de propiedad horizontal, si aplica", "Planos o licencia de construcción, si el banco los solicita"], "inmueble_nuevo": ["Promesa de compraventa con la constructora", "Certificado de tradición y libertad del lote o del inmueble", "Licencia de construcción y reglamento de propiedad horizontal", "Certificado de existencia y representación legal de la constructora", "Paz y salvo de predial"], "vendedor": ["Cédula de ciudadanía ampliada", "Promesa de compraventa firmada", "Certificado de libertad del inmueble sin gravámenes que impidan la venta"], "comprador": ["Carta de aprobación del crédito vigente", "Promesa de compraventa firmada", "Cédula ampliada y estado civil actualizado", "Comprobantes de pago de la cuota inicial y de las arras"]}, "banks": {"BBVA": {"notes": ["La carta de aprobación tiene una vigencia de 180 días; conviene firmar la escritura dentro de ese plazo.", "El avalúo lo hace una firma autorizada por el banco y el estudio de títulos lo hacen los abogados que asigna BBVA, con tarifas preestablecidas que paga el comprador. Los proyectos financiados por BBVA tienen descuento.", "El banco financia sobre el menor valor entre el avalúo y la promesa de compraventa.", "La garantía es una hipoteca abierta sin límite de cuantía en primer grado a favor de BBVA, más la firma del pagaré. En leasing se firma el contrato de leasing y el pagaré.", "Se contratan los seguros de vida y de incendio y terremoto, con BBVA o con una aseguradora autorizada; se pagan con la cuota.", "Los gastos de escrituración son cerca del 4% del valor del inmueble y se reparten entre comprador y vendedor. En compra de cartera no hay gastos de escrituración.", "El paz y salvo de un crédito cancelado se entrega en 3 días hábiles en la oficina donde se radicó.", "Avalúo (tarifario desde el 1 de julio de 2025, incluye desplazamientos; se ajusta cada 1 de julio): $185.000 hasta 90 SMMLV; 0,1% del valor comercial más IVA (mínimo $185.000) hasta $600 millones; $904.000 de $601 a $1.000 millones; $1.667.000 de $1.001 a $3.000 millones; por encima aplica cotización. En compra de cartera (concepto de valor): $138.000 en VIS y $198.000 en no VIS.", "Estudio de títulos (incluye IVA): $207.479 en VIS o VIP y $357.722 en no VIS; $94.439 si el proyecto está financiado por BBVA; $111.609 en cesión de hipoteca (compra de cartera)."]}, "Banco de Bogotá": {"notes": ["Vigencia de la aprobación: 540 días para vivienda nueva y 180 días para vivienda usada.", "Monto mínimo: $10.000.000 en VIS y $20.000.000 en no VIS. Financia hasta el 70% (no VIS) o el 80% (VIS) del valor comercial.", "Aún no hay más políticas de garantía cargadas para este banco; confirma con su asesor.", "Empleados del banco: 25% de descuento sobre la factura más IVA con certificado laboral (no aplica a la tarifa mínima). La cancelación de la hipoteca o la transferencia de leasing cuesta $159.360 + IVA.", "Tarifas de avalúo 2026 (incluyen IVA). Proyectos financiados: $134.404 en VIS y, en no VIS, 0,75 por mil del valor más IVA con mínimo de $156.851 hasta $700 millones y $881.783 por encima. Inmuebles usados, de proyectos no financiados o en remodelación: $150.949 en VIS y, en no VIS, 0,75 por mil más IVA con mínimo de $266.716 hasta $700 millones y $1.169.339 por encima.", "Compra de cartera: avalúo de $206.008 hasta $500 millones y, por encima, 0,7 por mil más IVA con máximo de $1.089.100 (campaña de compra de cartera: $191.771).", "Estudio de títulos (tarifas informadas antes por el banco): $147.250 (VIS) o $176.700 (no VIS) en vivienda nueva; $256.500 (VIS) o $330.000 (no VIS) en vivienda usada; $100.000 en cesión de hipoteca."]}, "Av Villas": {"notes": ["El avalúo se paga desde la radicación (tarifa del 0,125% más IVA) y no se devuelve si el crédito es negado. Se financia sobre el menor valor entre avalúo y promesa de compraventa.", "El cliente asume gastos notariales, beneficencia y registro.", "Inmuebles admisibles: vivienda unifamiliar con una sola cocina, en zona urbana, en buen estado de conservación, con garaje y depósito (en estrato 4 o más el garaje es obligatorio). El usado debe estar terminado.", "No se financian: lotes, fincas de recreo, obra gris o en remodelación, inmuebles con más de una cocina, locales de San Andresito, inmuebles mixtos (casa-local), viviendas sin reglamento de propiedad horizontal con varias soluciones habitacionales ni municipios donde el banco no tiene oficina.", "Para libre inversión no se puede hipotecar un inmueble con usufructo, embargos o patrimonio de familia.", "Tiempos del banco (días hábiles): estudio de títulos cerca de 10, revisión de la escritura cerca de 5 y visto bueno jurídico cerca de 1,5.", "Subrogación: si el vendedor tiene deuda con Av Villas, el banco la paga. Se financia hasta el 70% a 5 a 20 años, con hipoteca en segundo grado transitoria. El vendedor tiene 45 días para levantar la hipoteca.", "Construcción en sitio propio: al legalizar se pide el certificado de tradición del lote (no mayor a 30 días), escrituras de los últimos 10 años del lote, presupuesto de obra firmado por arquitecto o ingeniero civil, avalúo proyectado, licencia de construcción, cronograma y planos de obra, y acta de vecindades."]}, "Banco de Occidente": {"notes": ["Vigencia de la aprobación: 6 meses en vivienda usada y 18 meses en vivienda nueva.", "Se financia hasta el 70% (no VIS) o el 80% (VIS) del menor valor entre la compra y el avalúo comercial. Leasing hasta el 80%.", "Inmueble: vivienda terminada, estrato 3 en adelante, con parqueadero propio o de uso exclusivo, de hasta 50 años de construcción, con servicios públicos legalizados y que no sea de conservación o patrimonio.", "Compra de cartera: campaña Costo Cero, con estudio de títulos y avalúo sin costo. La oferta vinculante se radica al firmar la escritura.", "Vivienda nueva, documentos de la constructora: certificados de tradición en mayor extensión e individuales del apartamento y garajes (no mayores a 30 días), reglamento de propiedad horizontal, permiso de ventas, Cámara de Comercio o RUT, licencia de construcción, escrituras de tradición del proyecto de los últimos 10 años, promesa de compraventa o encargo fiduciario o contrato de beneficiario de área, minuta de transferencia modificable en Word, contrato fiduciario y datos de la persona que atenderá la visita del avalúo. Del cliente: consignación del avalúo y del estudio de títulos.", "Vivienda usada, documentos para legalizar: certificados de tradición y libertad de apartamento, depósito y garaje actualizados; copia de las consignaciones de avalúo y estudio de títulos; copia de la última escritura de compraventa; datos de quien atenderá la visita del avalúo; cédulas y datos completos de los vendedores (nombre, teléfono, correo y estado civil); paz y salvos de IDU, predial y administración.", "Requisitos de la vivienda usada según la presentación: máximo 50 años de construida, estrato 3 en adelante, parqueadero propio y vivienda unifamiliar (confirma este último punto con el banco).", "Avalúo (tarifa 2025, según el valor comercial): $246.266 hasta VIS; $427.050 hasta $300 millones; $540.930 hasta $450 millones; $782.925 hasta $600 millones; $982.215 hasta $750 millones; $1.138.800 hasta $1.000 millones; $1.565.850 hasta $2.000 millones y $1.822.080 por encima. Lo hace una firma evaluadora autorizada por el banco y se paga por transferencia a la cuenta de la firma.", "Estudio de títulos: $592.888, que se consigna al abogado externo que indique el banco; también se puede pagar en las oficinas de los bancos Aval."]}, "Credifamilia": {"notes": ["La carta definitiva de aprobación tiene 6 meses de vigencia; la preaprobación no vence.", "Avalúos en 4 horas hábiles y estudio de títulos y escrituración en 3 días hábiles.", "Vivienda usada: pueden aplicar excepciones de parqueadero y vetustez.", "Los gastos de legalización son una tarifa única que cubre el avalúo y el estudio de títulos, según el valor del inmueble (IVA incluido). Vivienda nueva: $460.000 en VIS, $620.000 hasta $290 millones, $940.000 hasta $480 millones y $1.240.000 hasta $600 millones. Vivienda usada: $550.000, $750.000, $1.070.000 y $1.450.000.", "Descuentos sobre la tarifa plena: 20% si se paga dentro de los 2 meses siguientes a la aprobación y 10% si se paga dentro de 6 meses. Visita a independientes: $180.000 (IVA incluido). Si el crédito se desiste por motivos ajenos a Credifamilia, el valor pagado no se devuelve."]}, "Hipocredit": {"notes": ["Al pasar a legalización se debe tener el certificado de tradición y libertad del inmueble con vigencia menor a 30 días y la copia de la escritura donde se vean áreas y linderos.", "En compra de vivienda con crédito hipotecario se necesita además la copia del contrato de compraventa.", "Inmuebles aceptados: residenciales terminados y habitables, en suelo urbano. Estrato 1 solo en propiedad horizontal; estratos 2 a 6: casa, apartamento o uso mixto (casa con local).", "Antigüedad máxima del inmueble de 30 años según el perito; por excepción hasta 45 años.", "No se reciben terrenos rústicos, inmuebles en litigio, en zonas de alto riesgo ambiental o sin infraestructura básica, viviendas rurales ni en obra negra.", "El inmueble debe estar en municipios con liquidez inmobiliaria (por ejemplo, con 2 o más proyectos de construcción activos) y donde Hipocredit tenga presencia.", "La diferencia entre el área del certificado de tradición y la construida certificada por el perito no puede ser mayor al 25%.", "El avalúo lo hace un perito independiente registrado y prevalece para la garantía; puede aplicarse un descuento conservador del 10% al 20% según el tipo de inmueble.", "Si el avalúo es 7% o más inferior al valor que informó el cliente, el desembolso se suspende y el caso vuelve a comité de riesgo y crédito. Diferencias menores no requieren nueva revisión.", "El inmueble debe estar libre de embargos, gravámenes y litigios, y asegurado contra incendio y desastres naturales por un valor igual o superior al saldo del préstamo, con Hipocredit como beneficiario.", "Gastos de originación del 2% sobre el desembolso.", "Avalúo y estudio de títulos de Hipocredit (antes de IVA): VIS $139.500 y $170.000; hasta $300 millones $242.000 y $330.000; hasta $400 millones $367.000 y $330.000; hasta $500 millones $444.000 y $330.000; hasta $1.000 millones $662.000 y $330.000. Se suma el IVA del 19% (total VIS $368.305; $680.680; $829.430; $921.060 y $1.180.480)."]}, "Caja Social": {"notes": ["La firma de pagarés y de la póliza de vida es digital con código OTC (modelo Star4u) o con pagarés físicos (modelo Crédito 6.0), según el perfil del cliente.", "Compra de cartera: se anexa también el último extracto del crédito hipotecario actual.", "Aplica el convenio con la Notaría 32.", "Radicación y viabilidades: se envían por correo al buzón de asesores inmobiliarios del banco, con el asunto \"Solicitud Viabilidad\" o \"Solicitud Radicación\" seguido de la cédula y el nombre del cliente. Las ofertas vinculantes y los saldos de compra de cartera tienen un buzón aparte.", "Cesión de crédito (compra de cartera), formatos: ECRE 080 (solicitud original de autorización, firmada y autenticada por todos los titulares, autenticación no mayor a 30 días) y autorización a terceros (diligenciada completa, firmada y autenticada por los titulares de la entidad cedente, autenticación no mayor a 30 días).", "Pagaré (solo modelo 6.0): impreso a una sola cara, con la firma de todos los deudores; los nombres y números de identificación se diligencian a computador antes de imprimir y no se escribe ciudad, día, mes ni año.", "Póliza IRT (solo modelo 6.0): con los datos del inmueble tal como están en el avalúo (parqueaderos y depósitos incluidos), impresa a una sola cara. Valor asegurado: en casa, el valor de la construcción; en apartamento, el valor total del inmueble.", "Avalúo en mercado natural, sobre el valor comercial (IVA incluido): 0,10% hasta 135 SMMLV; 0,11% hasta 150 SMMLV; 0,12% por encima. En cesión de crédito hipotecario: $178.500 en VIS y $220.150 en no VIS (IVA incluido). Si el banco financia el proyecto (subrogación de vivienda nueva) no se cobra avalúo ni estudio de títulos.", "Estudio de títulos en mercado natural (más IVA): $142.585 hasta 135 SMMLV; $214.010 hasta 150 SMMLV; $391.250 hasta 270 SMMLV y $659.745 por encima. El estudio de crédito no tiene costo. Para constructores reconocidos con cupo de venta aplican otras tarifas."]}}, "steps": [{"t": "Aprobación del crédito", "d": "El banco emite la carta de aprobación con el valor, plazo y vigencia."}, {"t": "Promesa de compraventa", "d": "Comprador y vendedor firman la promesa con precio, arras y fecha de escrituración."}, {"t": "Entrega de documentos al banco", "d": "Se radican los documentos del inmueble, del vendedor y del comprador."}, {"t": "Avalúo del inmueble", "d": "Un perito del banco visita y valora el inmueble. El banco financia sobre el menor entre avalúo y promesa."}, {"t": "Estudio de títulos", "d": "Un abogado revisa que el vendedor pueda vender y que el inmueble esté libre de problemas legales."}, {"t": "Minuta de escritura", "d": "El banco envía la minuta de hipoteca y la notaría prepara la escritura de compraventa."}, {"t": "Firma de la escritura", "d": "Comprador, vendedor y banco firman en la notaría y se pagan los gastos notariales."}, {"t": "Registro y beneficencia", "d": "Se paga el impuesto de beneficencia y se registra en la Oficina de Registro de Instrumentos Públicos."}, {"t": "Desembolso y entrega", "d": "El banco desembolsa al vendedor, se entrega el inmueble y se recibe el certificado de tradición con la hipoteca."}]}, "faqs": [{"q": "¿Qué es el avalúo y quién lo paga?", "a": "Es la valoración comercial del inmueble hecha por un perito aprobado por el banco. Lo paga el comprador, normalmente antes del estudio de títulos.", "g": "Gastos y trámite"}, {"q": "¿Qué es el estudio de títulos?", "a": "Es la revisión jurídica de los documentos del inmueble para confirmar que el vendedor es el dueño y que no hay embargos ni problemas que impidan la hipoteca.", "g": "Gastos y trámite"}, {"q": "¿Cuánto financia el banco del valor del inmueble?", "a": "Depende del banco y del tipo de vivienda. La vivienda VIS puede financiarse hasta el 80% y la no VIS hasta el 70%, sobre el menor valor entre avalúo y promesa de compraventa.", "g": "Gastos y trámite"}, {"q": "¿Quién paga los gastos de escrituración?", "a": "Los notariales de la compraventa se reparten por mitades entre comprador y vendedor. La hipoteca y su registro los asume el comprador. La retención en la fuente la paga el vendedor.", "g": "Gastos y trámite"}, {"q": "¿Qué pasa si el avalúo sale por debajo del precio pactado?", "a": "El banco presta sobre el valor del avalúo, así que el comprador debe cubrir la diferencia con recursos propios o renegociar el precio.", "g": "Gastos y trámite"}, {"g": "Gastos y trámite", "q": "¿Qué son los gastos de legalización y quién paga cada uno?", "a": "Son los costos de formalizar la compra y la hipoteca, además de la cuota inicial. En el simulador los ves en un gráfico: toca cada parte para ver cuánto es. Estos son los conceptos y quién los asume:", "l": [["Avalúo y estudio de títulos.", "Los pide el banco para verificar el valor y la situación legal del inmueble.", "Comprador"], ["Derechos notariales.", "Cobro de la notaría por la escritura de compraventa.", "50% comprador y 50% vendedor"], ["Gastos operativos e IVA.", "Copias, papel notarial y el IVA del 19% sobre los servicios de la notaría.", "50% comprador y 50% vendedor"], ["Retención en la fuente.", "Anticipo de renta que se descuenta al vendedor: 1%, y 2,5% si la venta supera 20.000 UVB.", "Vendedor"], ["Impuesto de beneficencia (rentas).", "Impuesto departamental sobre la escritura; entre 0,5% y 1% según el departamento.", "Comprador"], ["Derechos de registro.", "Inscripción de la escritura en la Oficina de Registro de Instrumentos Públicos (ORIP); entre 0,62% y 1,67% según el caso.", "Comprador"], ["Constitución y registro de la hipoteca.", "Escritura de la hipoteca a favor del banco (cerca del 0,30% del crédito) y su inscripción en la ORIP.", "Comprador (deudor)"], ["Comisión de originación.", "La cobran algunos bancos por abrir el crédito.", "Comprador"]]}, {"g": "Gastos y trámite", "q": "¿Qué cuesta legalizar un crédito si ya soy dueño del inmueble?", "a": "En remodelación, libre inversión y compra de cartera no hay nueva escritura de compraventa, vendedor ni retención en la fuente. En remodelación y libre inversión se pagan avalúo, estudio de títulos, constitución de la hipoteca, beneficencia y registro. En compra de cartera, solo avalúo y estudio de títulos."}, {"g": "Gastos y trámite", "q": "¿Cuánto tarda todo el proceso?", "a": "El estudio de crédito suele responder en pocos días hábiles. Después vienen el avalúo, el estudio de títulos, la firma de escrituras y el desembolso. Los tiempos dependen del banco, de la notaría y de que los documentos estén completos."}, {"g": "Gastos y trámite", "q": "¿Qué es la hipoteca y por qué se registra?", "a": "Es la garantía a favor del banco sobre el inmueble. Se firma en la notaría y se registra en la Oficina de Registro de Instrumentos Públicos. Al terminar de pagar el crédito, se levanta."}, {"g": "Gastos y trámite", "q": "¿Quién escoge el avalúo y el estudio de títulos?", "a": "El banco. Trabaja con peritos y abogados aprobados, y el cliente paga las tarifas del banco antes de continuar con el trámite."}, {"g": "Gastos de legalización", "q": "¿Qué son los gastos de legalización y escrituración?", "a": "Son los pagos, además de la cuota inicial, que se hacen para formalizar la compra y el crédito: avalúo y estudio de títulos del banco, derechos de la notaría, impuesto de beneficencia, registro del inmueble y de la hipoteca, y la retención en la fuente que descuentan al vendedor. En el simulador los ves en la pestaña Legalización, repartidos entre comprador y vendedor. Es un cálculo aproximado: el banco, la notaría y la oficina de registro confirman el valor final."}, {"g": "Gastos de legalización", "q": "¿Qué son los derechos notariales y quién los paga?", "a": "Es el cobro de la notaría por la escritura de compraventa. Se pagan 50% por el comprador y 50% por el vendedor."}, {"g": "Gastos de legalización", "q": "¿Qué es la retención en la fuente?", "a": "Es un anticipo de renta que se descuenta al vendedor al escriturar. Es 1% del valor de la venta y sube a 2,5% si supera 20.000 UVB (aproximadamente $996.000.000). Lo paga el vendedor."}, {"g": "Gastos de legalización", "q": "¿Qué es el impuesto de beneficencia (rentas)?", "a": "Es un impuesto departamental que se liquida sobre la escritura; va entre 0,5% y 1% según el departamento. Lo paga el comprador. En remodelación, libre inversión y compra de cartera se liquida sobre la escritura de la hipoteca, es decir, sobre el valor del crédito."}, {"g": "Gastos de legalización", "q": "¿Qué son los derechos de registro?", "a": "Es el costo de inscribir la escritura en la Oficina de Registro de Instrumentos Públicos (ORIP); va entre 0,62% y 1,67% según el caso. Lo paga el comprador."}, {"g": "Gastos de legalización", "q": "¿Qué son los gastos operativos y el IVA de la notaría?", "a": "Son las copias, el papel notarial y el IVA del 19% sobre los servicios de la notaría. Se reparten 50% comprador y 50% vendedor."}, {"g": "Gastos de legalización", "q": "¿Qué es la constitución de la hipoteca?", "a": "Es la escritura de la hipoteca a favor del banco (cerca del 0,30% del crédito) más su registro. La paga el comprador, que es el deudor. En remodelación, libre inversión y compra de cartera no hay nueva escritura de compraventa porque el inmueble ya está a nombre del cliente."}, {"g": "Gastos de legalización", "q": "¿Para qué piden avalúo y estudio de títulos?", "a": "El banco los pide para verificar el valor del inmueble y su situación legal. Los hace con sus propios peritos y abogados, y los paga el comprador antes de continuar con el crédito."}, {"q": "¿Cuánto dura la aprobación del crédito?", "a": "Cada banco fija una vigencia. En BBVA es de unos 180 días. Pasado ese tiempo hay que actualizar el estudio.", "g": "Aprobación y vigencia"}, {"g": "Aprobación y vigencia", "q": "¿Por qué el crédito aprobado puede ser menor al que pedí?", "a": "El banco limita el crédito por tus ingresos, tus deudas actuales, el porcentaje máximo que financia del valor del inmueble y su monto máximo. En la simulación aparece como valor ajustado."}, {"g": "Aprobación y vigencia", "q": "¿Por qué la tasa final puede ser distinta a la del simulador?", "a": "El simulador usa la tasa más baja publicada. La tasa final depende de tu segmento, tu comportamiento en centrales de riesgo, el plazo, el monto y las condiciones del banco."}, {"g": "Aprobación y vigencia", "q": "¿Qué pasa si tengo reportes negativos en centrales de riesgo?", "a": "Con reportes vigentes el crédito normalmente no se tramita. Algunos bancos estudian casos con obligaciones castigadas ya pagadas, según el puntaje y el tiempo transcurrido. Tu asesor puede orientarte."}, {"g": "Aprobación y vigencia", "q": "¿Puedo sumar los ingresos de mi pareja o de un familiar?", "a": "Sí, varios bancos permiten sumar ingresos de familiares directos (cónyuge, padres, hijos, hermanos). El banco define cuántos y los documentos que debe entregar cada uno."}, {"g": "Aprobación y vigencia", "q": "¿Cuánto me reconocen de mis ingresos si soy independiente?", "a": "Algunos bancos reconocen solo un porcentaje según la actividad, por ejemplo comercio, servicios o profesional. Por eso el crédito puede ser menor que con un ingreso de empleado igual."}, {"q": "¿Cuánto financia el banco del valor del inmueble?", "a": "Depende del banco y del tipo de vivienda. La vivienda VIS puede financiarse hasta el 80% y la no VIS hasta el 70%, sobre el menor valor entre avalúo y promesa de compraventa.", "g": "Aprobación y vigencia"}, {"g": "Tipos de crédito", "q": "¿Qué es VIS y cuál es su tope?", "a": "Vivienda de Interés Social: inmuebles de hasta 135 salarios mínimos mensuales (150 en algunos municipios). Tienen tasas especiales y mayor porcentaje de financiación en varios bancos."}, {"g": "Tipos de crédito", "q": "¿Qué diferencia hay entre pesos y UVR?", "a": "En pesos la cuota es fija en el tiempo. En UVR la tasa suele ser menor, pero el saldo y la cuota se ajustan con la inflación, así que la cuota sube con los años."}, {"g": "Tipos de crédito", "q": "¿Qué es el leasing habitacional?", "a": "El banco compra el inmueble y te lo entrega en arriendo con opción de compra. Pagas un canon mensual y, al final, ejerces la opción de compra. Aplica a vivienda no VIS y puede dar beneficios tributarios."}, {"g": "Tipos de crédito", "q": "¿Qué es el leasing no familiar?", "a": "Es el leasing para personas que compran juntas sin ser familia, o para inmuebles que pueden usarse para renta corta o turismo. En Banco de Bogotá tiene la misma tasa del leasing normal."}, {"g": "Tipos de crédito", "q": "¿Qué es la compra de cartera y cuándo conviene?", "a": "Es pasar tu crédito de vivienda actual a otro banco para conseguir una tasa menor o mejor plazo. Conviene si la nueva tasa baja la cuota lo suficiente para cubrir el avalúo y el estudio de títulos."}, {"g": "Tipos de crédito", "q": "¿Puedo comprar solo una parte de mi deuda?", "a": "No. En la compra de cartera todos los bancos compran el 100% del saldo de la deuda; no se puede hacer parcial. Si el banco no alcanza a cubrir el saldo completo con tus ingresos o con el valor del inmueble, la compra no aplica."}, {"g": "Tipos de crédito", "q": "¿Qué es el crédito de libre inversión con garantía hipotecaria?", "a": "Es dinero para cualquier uso, con tu vivienda como garantía. Se paga en cuotas mensuales y suele tener menor tasa que un crédito de consumo."}, {"g": "Tipos de crédito", "q": "¿Puedo remodelar mi vivienda con un crédito?", "a": "Sí. El crédito de remodelación financia mejoras del inmueble que ya es tuyo. El banco puede pedir presupuesto o cotizaciones y el avalúo del inmueble."}, {"g": "Cuota y pagos", "q": "¿Qué significa tasa efectiva anual y tasa mensual?", "a": "La tasa efectiva anual (EA) es el costo total del crédito en un año. La tasa mensual vencida es la que se aplica cada mes a tu saldo."}, {"g": "Cuota y pagos", "q": "¿Puedo pagar el crédito antes de tiempo?", "a": "Sí. Puedes hacer abonos a capital o pagar todo el saldo, y normalmente eliges si bajar la cuota o el plazo. Confirma con el banco las condiciones de prepago."}, {"g": "Cuota y pagos", "q": "¿Qué incluye la cuota mensual?", "a": "Capital, intereses y, si lo incluyes en la simulación, el seguro de vida y el seguro de incendio y terremoto. Los valores de seguros son estimados."}, {"q": "¿Debo tener seguros?", "a": "Sí. Los créditos de vivienda exigen seguro de vida del deudor y de incendio y terremoto del inmueble.", "g": "Cuota y pagos"}, {"g": "Cuota y pagos", "q": "¿Qué pasa si no puedo pagar una cuota?", "a": "Avisa al banco lo antes posible. Hay alternativas como periodos de gracia o reestructuración, y una mora prolongada puede llevar a cobro jurídico y afectar tu historial."}, {"g": "Perfil especial", "q": "¿Qué documentos necesito si soy independiente?", "a": "Normalmente declaración de renta o certificación de ingresos, extractos bancarios de los últimos meses, Cámara de Comercio o RUT y referencias. Revisa la pestaña Documentos para tu perfil exacto."}, {"g": "Perfil especial", "q": "¿Hay subsidios de vivienda?", "a": "Existen subsidios del Gobierno y de las cajas de compensación para vivienda VIS. Su disponibilidad y requisitos cambian; tu asesor puede revisar si aplicas."}], "uvrDate": "2026-10-15", "infPath": {"src": "Encuesta mensual de expectativas del Banco de la República, septiembre de 2026", "start": "2026-10", "pts": [[0, 6.29], [2, 6.81], [14, 5.06], [22, 4.03]], "endMonths": 46}, "leadUrl": "https://script.google.com/macros/s/AKfycbx0-N-hv7v45HoEwT96HzbHfGzNIxnVJCC4P5e3UaLRkUAxqfwWuZ85RowlkpUKBvq6/exec", "privacyUrl": "https://drive.google.com/file/d/1BUpoSu0UVyNy0dsXkmw6xF_Go8Ag7uVY/view?usp=drive_link"}</script>
<script>
(function(){
const SNAP=document.body.innerHTML;
const OPEN='<scr'+'ipt type="application/json" id="state">';

function bindMoney(el){
  el.addEventListener('input',function(){
    const pos=el.selectionStart;
    const before=el.value.slice(0,pos).replace(/\D/g,'').length;
    const d=el.value.replace(/\D/g,'');
    el.value=d?group(d):'';
    let c=0,np=0;
    for(;np<el.value.length&&c<before;np++){if(/\d/.test(el.value[np]))c++;}
    try{el.setSelectionRange(np,np);}catch(e){}
    update();
  });
}

function renderProfile(inp){
  ACTK.forEach(function(k){$('#w-inc-'+k).hidden=inp.acts.indexOf(k)<0;});
  const sum=$('#prof-sum'),el=$('#elig');
  const names=inp.acts.map(function(k){return ACT[k].n;}).join(' + ')||'Sin actividad seleccionada';

  if(!(inp.age>=18)||!(inp.ingresos>0)){el.innerHTML='<p class="hint">Completa la edad y los ingresos para ver con qué bancos aplica.</p>';return;}
  const cards=S.banks.map(function(b){
    let pb=profBlock(b,inp);const pol=policy(b);
    const offers=PROD[inp.prod].keys.some(function(k){const p=b.products[k];return p&&(p.rate>0||p.rateUvr>0);});
    if(!pb&&!offers)pb=b.name+' no ofrece '+PROD[inp.prod].n.toLowerCase()+'.';
    const notes=[];
    if(!pol.uvrIndep&&inp.indep)notes.push('Como independiente, solo en pesos (sin UVR).');
    if(!pb)bankNotesFor(b,inp).forEach(function(t){notes.push(t);});
    const html='<article class="eb"><div class="eb-top"><h4>'+esc(b.name)+'</h4><span class="status '+(pb?'no':'ok')+'">'+(pb?'No aplica':'Aplica por perfil')+'</span></div>'+(pb?'<p class="note alert">'+esc(pb)+'</p>':'')+(notes.length&&ADV?'<details class="more"><summary>Ver políticas del banco</summary>'+notes.map(function(t){return '<p class="note">'+esc(t)+'</p>';}).join('')+'</details>':'')+'</article>';
    return {ok:!pb,html:html};
  });
  const yes=cards.filter(function(c){return c.ok;});
  el.className=ADV?'elig':'elig elig-c';el.innerHTML=yes.length?yes.map(function(c){return c.html;}).join(''):'<p class="hint">Con este perfil y este producto ningún banco aplica por ahora. Revisa la edad, los ingresos, la actividad o el tipo de producto.</p>';
  el.scrollLeft=0;
}

function altOpts(o,inp){
  const out=[],p=o.bank.products[o.key];
  if(!p||!p.alts)return out;
  const RK=['rate','rateVis','rateNom','rateVisNom','rateUvr','rateUvrVis','rateUvrNom','rateUvrVisNom','tiers','bands','minLoan'];
  p.alts.forEach(function(a){
    if((a.label||'').startsWith('Tu segmento'))return;
    if(a.vis===true&&!inp.vis)return;
    if(a.nueva&&!inp.nueva)return;
    if(a.vis===false&&inp.vis)return;
    const ingT=adjInc(o.bank,inp).ingTit;
    const bogC=cityType(inp)==='A',mi=bogC?a.minInc:(a.minIncOther>0?a.minIncOther:a.minInc),ma=bogC?a.maxInc:(a.maxIncOther>0?a.maxIncOther:a.maxInc);
    if(mi>0&&ingT<mi)return;
    if(ma>0&&ingT>=ma)return;
    const p2=Object.assign({},p);RK.forEach(function(k){delete p2[k];});
    RK.forEach(function(k){if(a[k]!=null)p2[k]=a[k];});p2._noSeg=true;
    const prods=Object.assign({},o.bank.products);prods[o.key]=p2;
    const b2=Object.assign({},o.bank,{products:prods});
    const r=calc(b2,o.key,inp,inp.term);
    if(!r||!r.avail||!(r.ok||r.adj)||(!a.always&&!(r.rate<o.rate-1e-9)))return;
    const o2={bank:o.bank,key:o.key,avail:true,rate:r.rate,r:r,ok:r.ok,adj:!r.ok&&r.adj,cuota:r.cuota,amount:r.amount};
    if(o.key==='cartera'){o2.cur=r.cur;o2.dest=r.dest;o2.curEq=r.curEq;o2.newEq=r.newEq;}
    out.push({o:o2,a:a});
  });
  return out;
}

function amortHtml(r,uvr,keyid){
  const n=r.n,P0=r.amount,i=Math.pow(1+r.rate/100,1/12)-1,cap=r.amort==='capital';
  if(!(n>0)||!(P0>0)||!(i>0))return '';
  const f=cap?null:P0*i/(1-Math.pow(1+i,-n));
  const cps=[12,60,120,180,240,300,360].filter(function(m){return m<n;});cps.push(n);
  let sal=P0,ia=0,ca=0,m=0,rows=[];
  cps.forEach(function(lim){
    let cuo=0;
    for(;m<lim;m++){const it=sal*i,c=cap?P0/n:f-it;cuo=cap?(P0/n+it):f;ia+=it;ca+=cap?P0/n:c;sal=cap?P0-ca:sal-c;}
    rows.push('<tr><td>'+(lim===n&&lim%12?fmtT(lim/12):'Año '+(lim/12))+'</td><td>'+money(cuo)+'</td><td>'+money(ia)+'</td><td>'+money(ca)+'</td><td>'+money(Math.max(0,sal))+'</td></tr>');
  });
  const tbl='<div class="tw"><table class="tt am"><thead><tr><th>Plazo</th><th>Cuota</th><th>Intereses</th><th>Capital</th><th>Deuda</th></tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'+
    '<p class="note"><b>Observación:</b> esta tabla no incluye los seguros de vida ni de incendio y terremoto. Por eso la cuota es menor que la cuota mensual de arriba, que los incluye cuando los activaste en la simulación.</p><p class="note">La cuota es la mensual en ese año; intereses y capital están acumulados desde el desembolso y la deuda es la pendiente al cierre. Se calcula con la tasa "desde"'+(cap?'. La cuota baja cada mes porque el abono a capital es constante':'')+(uvr?'. En UVR los valores están en pesos de hoy: con la inflación los valores en pesos serán mayores':'')+'. Es una guía; la tabla oficial la entrega el banco.</p>';
  return acc('am:'+keyid,I('calc')+' Ver cómo baja tu deuda año a año',tbl,false);
}

function feeTier(tiers,valor,vis){
  const iva=1+S.costs.iva/100;let last=null,hit=null;
  const val=function(t){if(t.pct!=null){let x=valor*t.pct/100*(t.iva?iva:1);if(t.min!=null)x=Math.max(x,t.min);if(t.max!=null)x=Math.min(x,t.max);return x;}
    if(t.v!=null)return t.v*(t.iva?iva:1);return null;};
  for(let i=0;i<tiers.length;i++){
    const t=tiers[i];if(t.vis!=null&&t.vis!==vis)continue;
    const x=val(t);if(x!=null)last={v:x,n:t.n||'',pct:t.pct};
    if(t.upTo!=null&&valor>t.upTo)continue;
    if(t.upToSm!=null&&valor>t.upToSm*S.smmlv)continue;
    if(x==null)continue;
    hit={v:x,n:t.n||'',pct:t.pct,over:false};break;
  }
  if(!hit&&last)hit={v:last.v,n:last.n,pct:last.pct,over:true};
  return hit;
}

function legalDonut(rows,ownMode,who){
  const key=who==='v'?3:(who==='t'?1:2);
  const items=rows.filter(function(r){return r[4]!=='No aplica'&&r[key]>0;}).map(function(r,i){return {n:r[0],s:legShort(r[0]),amt:r[key],pays:r[4],note:r[5]||'',d:legDesc(r[0]),col:LEGCOL[i%LEGCOL.length]};});
  const tot=items.reduce(function(s,x){return s+x.amt;},0);
  LEGSEG=items;LEGSEL=-1;
  items.forEach(function(x){x.pct=tot>0?x.amt/tot*100:0;});
  const lab=ownMode?'Total a pagar':(who==='v'?'Total del vendedor':(who==='t'?'Total de gastos':'Total del comprador'));
  LEGTOT={label:lab,amt:money1k(tot)};
  if(!items.length)return '<p class="hint">No hay gastos para mostrar con esta selección.</p>';
  const R=78,C=2*Math.PI*R,gap=items.length>1?2.5:0;let cum=0;
  const segs=items.map(function(x,i){const len=Math.max(0.5,x.pct/100*C-gap);const s='<circle class="sg" data-i="'+i+'" cx="100" cy="100" r="'+R+'" fill="none" stroke="'+x.col+'" stroke-width="26" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-cum).toFixed(2)+'" tabindex="0" role="button" aria-label="'+esc(x.s)+': '+money1k(x.amt)+'"/>';cum+=x.pct/100*C;return s;}).join('');
  const tabs=ownMode?'':'<div class="dn-tabs" role="tablist">'+[['c','Lo que paga el comprador'],['v','Lo que paga el vendedor'],['t','Total de gastos']].map(function(t){return '<button type="button" role="tab" class="dn-tab'+(who===t[0]?' on':'')+'" data-who="'+t[0]+'" aria-selected="'+(who===t[0])+'">'+t[1]+'</button>';}).join('')+'</div>';
  const leg='<ul class="dn-leg">'+items.map(function(x,i){return '<li><button type="button" class="dn-li" data-i="'+i+'"><i style="background:'+x.col+'"></i><span class="n">'+esc(x.s)+'</span><b>'+money1k(x.amt)+'</b><em>'+pct(x.pct,1)+'%</em></button></li>';}).join('')+'</ul>';
  return tabs+'<div class="dn-wrap"><div class="dn-chart"><svg class="dn" viewBox="0 0 200 200" role="img" aria-label="Distribución de los gastos de legalización"><g transform="rotate(-90 100 100)">'+segs+'</g></svg><div class="dn-c" id="dn-c"><small>'+esc(lab)+'</small><b>'+money1k(tot)+'</b><span>Toca una parte para ver el detalle</span></div></div><div class="dn-side">'+leg+'<div class="dn-det" id="dn-det"></div></div></div>';
}
function legShow(i){
  const c=$('#dn-c'),d=$('#dn-det');if(!c)return;
  const segs=document.querySelectorAll('#legal-body .sg'),lis=document.querySelectorAll('#legal-body .dn-li');
  segs.forEach(function(s){s.classList.toggle('on',+s.getAttribute('data-i')===i);s.classList.toggle('dim',i>=0&&+s.getAttribute('data-i')!==i);});
  lis.forEach(function(s){s.classList.toggle('on',+s.getAttribute('data-i')===i);});
  if(i<0||!LEGSEG[i]){c.innerHTML='<small>'+esc(LEGTOT.label)+'</small><b>'+LEGTOT.amt+'</b><span>Toca una parte para ver el detalle</span>';d.innerHTML='';d.hidden=true;return;}
  const x=LEGSEG[i];
  c.innerHTML='<small>'+esc(x.s)+'</small><b>'+money1k(x.amt)+'</b><span>'+pct(x.pct,1)+'% del total</span>';
  d.hidden=false;d.style.borderColor=x.col;
  d.innerHTML='<h4>'+esc(x.n)+'</h4>'+(x.d?'<p>'+esc(x.d)+'</p>':'')+'<p class="pay"><b>Paga:</b> '+esc(x.pays)+(x.note?' · '+esc(x.note):'')+'</p>';
}
function legalInit(){
  const root=$('#legal-body');if(!root)return;
  root.addEventListener('click',function(ev){
    const t=ev.target.closest&&ev.target.closest('.dn-tab');
    if(t){LEGWHO=t.getAttribute('data-who');root.removeAttribute('data-sig');renderLegal(readInputs());return;}
    const el=ev.target.closest&&ev.target.closest('.sg,.dn-li');
    if(el){const i=+el.getAttribute('data-i');LEGSEL=LEGSEL===i?-1:i;legShow(LEGSEL);}
  });
  root.addEventListener('mouseover',function(ev){const el=ev.target.closest&&ev.target.closest('.sg,.dn-li');if(el)legShow(+el.getAttribute('data-i'));});
  root.addEventListener('mouseout',function(ev){const el=ev.target.closest&&ev.target.closest('.sg,.dn-li');if(el)legShow(LEGSEL);});
  root.addEventListener('keydown',function(ev){if((ev.key==='Enter'||ev.key===' ')&&ev.target.classList&&ev.target.classList.contains('sg')){ev.preventDefault();const i=+ev.target.getAttribute('data-i');LEGSEL=LEGSEL===i?-1:i;legShow(LEGSEL);}});
}

  const tEnd=tableHtml.indexOf('</table></div>')+14;const costHtml='<div class="cost2">'+legalDonut(rows,ownMode,ownMode?'c':LEGWHO)+'</div>'+(ADV?'<details class="more"><summary>Ver en tabla</summary>'+tableHtml.slice(0,tEnd)+'</details>':'')+tableHtml.slice(tEnd);

  if(out.getAttribute('data-sig')===sig)return;
  out.setAttribute('data-sig',sig);
  out.innerHTML=

let LEADCTX=null,LEADSENT=false;
function leadInit(){
  const f=$('#lead-f');if(!f)return;
  const err=function(m){const e=$('#l-err');e.textContent=m;e.hidden=!m;};
  f.addEventListener('submit',function(ev){
    ev.preventDefault();err('');
    if($('#l-hp').value)return;
    const nombre=$('#l-name').value.trim(),mail=$('#l-mail').value.trim();
    let tel=$('#l-tel').value.replace(/[^\d+]/g,'').replace(/^\+?57/,'');
    if(nombre.length<3||nombre.indexOf(' ')<0){err('Escribe tu nombre y apellido.');return;}
    if(!/^3\d{9}$/.test(tel)){err('Escribe un celular colombiano de 10 dígitos, por ejemplo 300 123 4567.');return;}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mail)){err('Revisa tu correo electrónico.');return;}
    if(!$('#l-ok').checked){err('Debes autorizar el tratamiento de tus datos para continuar.');return;}
    const payload=Object.assign({fecha:new Date().toISOString(),nombre:nombre,celular:tel,correo:mail,autorizacion:'Sí',version_politica:'1.0',origen:(function(){try{return location.href.split('#')[0];}catch(e){return '';}})()},LEADCTX||{});
    payload.top3=JSON.stringify(payload.top3||[]);
    const btn=$('#l-send');btn.disabled=true;btn.textContent='Enviando…';
    const done=function(){LEADSENT=true;f.hidden=true;$('#l-done').hidden=false;};
    if(S.leadUrl){
      fetch(S.leadUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(done).catch(function(){btn.disabled=false;btn.textContent='Quiero mi asesoría gratuita';err('No pudimos enviar tus datos. Intenta de nuevo o escríbenos a comercial@agilehomesf.com.');});
    }else{
      const body='Nombre: '+nombre+'\nCelular: '+tel+'\nCorreo: '+mail+'\nProducto: '+(payload.producto||'')+'\nValor inmueble: '+(payload.valor_inmueble||'')+'\nMejor banco: '+(payload.mejor_banco||'')+'\nAutorizo el tratamiento de mis datos según la política de Agile Home.';
      try{location.href='mailto:comercial@agilehomesf.com?subject='+encodeURIComponent('Quiero asesoría - Agile Match')+'&body='+encodeURIComponent(body);}catch(e){}
      done();
    }
  });
}

    body=g+'\n\n'+(formal?'Agradecemos su confianza en Agile Home. ':'Gracias por confiar en Agile Home. ')+resumen+' '+(items.length?(formal?'Estas son las opciones que mejor se ajustan a su perfil:':'Estas son las opciones que mejor se ajustan a tu perfil:')+'\n\n'+items.map(function(o,i){return (i+1)+'. '+cmLine(o);}).join('\n\n'):'')+'\n\n'+(formal?'Si le parece bien, el siguiente paso es reunir los documentos de su perfil y radicar la solicitud. Con gusto le envío la lista exacta y resuelvo cualquier duda.':'Si te parece bien, el siguiente paso es reunir los documentos de tu perfil y radicar la solicitud. Te envío la lista exacta y resuelvo cualquier duda.')+'\n\n'+(formal?'Quedo atento(a).':'Quedo atento(a).')+'\n\n'+(sig.name?sig.name+'\n':'')+(sig.contact?sig.contact+'\n':'')+'Agile Home\n\n'+cmLegal();
  }else{
    const e=function(x){return formal?'':x;};
    body=g+' '+e('🏠 ')+(formal?'Le comparto':'Te comparto')+' la simulación de tu crédito de vivienda.\n'+(COMM?'\n'+'Ingresos totales: *'+money(COMM.ingresos)+'* · Inmueble: *'+money(COMM.valor)+'*':'')+'\n\n'+items.map(function(o,i){return e('✅ ')+'*'+o.banco+'* ('+o.linea+')\nCrédito: '+money(o.monto)+'\nCuota aprox.: '+money(o.cuota)+'/mes'+(o.uvr?' (UVR)':'')+'\nTasa desde: '+(o.uvr?'UVR + ':'')+pct(o.tasa,2)+'% EA'+(o.plazo?'\nPlazo: '+o.plazo+' años':'');}).join('\n\n')+'\n\n'+(formal?'¿Le parece si avanzamos con los documentos?':'¿Te parece si avanzamos con los documentos? '+e('📄'))+'\n\n'+(sig.name?sig.name+' · ':'')+'Agile Home'+(sig.contact?' · '+sig.contact:'')+'\n\n_'+cmLegal().split('. ')[0]+'. La aprobación depende del estudio de crédito de cada entidad._';
  }
  return {subj:subj,body:body};
}
function renderComm(){

function cmFill(){
  const r=cmGen();$('#cm-subj').value=r.subj;$('#cm-text').value=r.body;COMMDIRTY=false;
}
function cmInit(){
  const root=$('#pane6');if(!root)return;
  const regen=function(){COMMDIRTY=false;cmFill();renderComm();};
  Array.prototype.forEach.call(document.querySelectorAll('#cm-chs button'),function(b){b.addEventListener('click',function(){COMMCH=b.getAttribute('data-c');regen();});});
  ['#cm-name','#cm-tone','#cm-topic','#cm-net'].forEach(function(s){$(s).addEventListener('input',regen);$(s).addEventListener('change',regen);});
  $('#cm-banks').addEventListener('change',regen);

  $('#cm-reset').addEventListener('click',regen);
  $('#cm-copy').addEventListener('click',function(){
    const msg=$('#cm-msg'),txt=($('#cm-subj').hidden||COMMCH!=='mail'?'':'Asunto: '+$('#cm-subj').value+'\n\n')+$('#cm-text').value;
    const fb=function(){const t=$('#cm-text');t.focus();t.select();msg.textContent='Selecciona y copia el texto.';};
    try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){msg.textContent='Copiado.';},fb);else fb();}catch(e){fb();}
  });
  $('#cm-go').addEventListener('click',function(){

      else{let ph=($('#cm-phone').value||'').replace(/\D/g,'');if(ph.length===10)ph='57'+ph;window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(txt),'_blank');}

  });

/* ---------- panel del asesor ---------- */
function buildDoc(state){
  const json=JSON.stringify(state).replace(/</g,'\\u003c');
  const a=SNAP.indexOf(OPEN);
  if(a<0)return null;
  const s=a+OPEN.length,e=SNAP.indexOf(CLOSE,s);
  const body=SNAP.slice(0,s)+json+SNAP.slice(e);
  const st=document.head&&document.head.querySelector('style');
  const css=st?st.textContent:':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+css+'</style></head><body>'+body+'</body></html>';
}
function g(id,label,val,hint){
  return '<div class="field"><label for="'+id+'">'+label+'</label><div class="inwrap"><input id="'+id+'" type="text" inputmode="decimal" value="'+esc(val)+'"></div>'+(hint?'<small>'+hint+'</small>':'')+'</div>';
}
const POL=[['ageMinEmp','Edad mín. asalariados (años)',0],['ageMinInd','Edad mín. independientes (años)',0],['ageMaxApply','Edad máx. para solicitar (años)',0],['termMin','Plazo mín. (años)',0],['termMaxExt','Plazo máx. exterior (años)',0],['minLoanVis','Crédito mín. VIS ($)',1],['minLoanNoVis','Crédito mín. no VIS ($)',1],['ratioVis','Cuota/ingreso VIS %',0],['ratioNoVis','Cuota/ingreso no VIS %',0],['minIncExt','Ingreso mín. exterior (SMMLV)',0],['originPct','Comisión de originación (% del crédito)',0],['minInc','Ingreso mín. (SMMLV)',0],['minIncInd','Ingreso mín. independientes (SMMLV)',0],['termMaxVis','Plazo máx. VIS (años)',0],['termMaxNoVis','Plazo máx. no VIS (años)',0],['nfMaxLoan','Crédito máx. indep. no formal, no VIS ($)',1],['nfTermMax','Plazo máx. indep. no formal (años)',0],['avaluoPct','Avalúo propio del banco (% del inmueble)',0]];
const COSTF=[['avaluoPct','Avalúo (% del inmueble)'],['titulosPct','Estudio de títulos (% del inmueble)'],['titulosMaxSmmlv','Tope estudio de títulos (SMMLV)'],['notCompraPct','Notariales compraventa, parte del comprador (%)'],['notHipPct','Notariales hipoteca (% del crédito)'],['iva','IVA sobre notariales (%)'],['regBenefPct','Registro y beneficencia compraventa (%)'],['regHipPct','Registro hipoteca (% del crédito)'],['visDesc','Descuento VIS en notariales y registro (%)']];
function polFS(b,i){
  const q=b.policy||{};
  return '<fieldset class="prod"><legend>Políticas del banco</legend>'+POL.map(function(f){const v=q[f[0]]>0?q[f[0]]:'';return g('b'+i+'-p-'+f[0],f[1],v===''?'':(f[2]?group(v):dnum(v)),'Vacío = sin regla propia');}).join('')+
  '<label class="chk"><input type="checkbox" id="b'+i+'-p-uvr"'+(q.uvrIndep!==false?' checked':'')+'><span>Los independientes pueden optar por UVR</span></label><label class="chk"><input type="checkbox" id="b'+i+'-p-iva"'+(q.avaluoIva===true?' checked':'')+'><span>El avalúo propio lleva IVA</span></label><label class="chk"><input type="checkbox" id="b'+i+'-p-exp"'+(q.expRules===true?' checked':'')+'><span>Exige experiencia crediticia a independientes</span></label></fieldset>';
}
function ownerUI(){
  const stale=S.smmlvYear<new Date().getFullYear()?'<span class="alertline">El SMMLV guardado es de '+S.smmlvYear+'. Actualízalo para calcular bien el tope VIS.</span>':'';
  const banks=S.banks.map(function(b,i){
    return '<details class="bank-edit"><summary>'+esc(b.name)+'</summary><div class="grid-p">'+
    '<div class="field"><label for="b'+i+'-name">Nombre</label><div class="inwrap"><input id="b'+i+'-name" type="text" value="'+esc(b.name)+'"></div></div>'+
    g('b'+i+'-age','Edad máx. al finalizar (edad + plazo)',b.maxAge,'Años')+g('b'+i+'-term','Plazo máx.',b.maxTerm,'Años')+
    PR.map(function(pr){const k=pr[0],p=b.products[k];
      return '<fieldset class="prod"><legend>'+pr[1]+'</legend>'+((p.tiers||p.bands||p.rateVis>0||p.rateNom>0)?'<p class="note">Este producto tiene tasas por plazo, VIS o nómina cargadas de la cartelera. Aquí solo editas la tasa base; para cambiar el detalle pídeselo a Claude.</p>':'')+g('b'+i+'-'+k+'-rate',k==='cartera'?'Tasa en pesos EA %':'Tasa EA %',p.rate==null?'':dnum(p.rate),'Vacío si no lo ofrece')+(k==='cartera'?g('b'+i+'-'+k+'-rateuvr','Tasa en UVR EA %',p.rateUvr==null?'':dnum(p.rateUvr),'Vacío si no lo ofrece'):'')+g('b'+i+'-'+k+'-ltv','Financiación no VIS %',dnum(p.ltv))+g('b'+i+'-'+k+'-ltvvis','Financiación VIS %',dnum(p.ltvVis>0?p.ltvVis:p.ltv))+(k==='libre'?g('b'+i+'-'+k+'-maxm','Plazo máx. (meses)',p.maxMonths||84):'')+'</fieldset>';
    }).join('')+polFS(b,i)+'</div></details>';
  }).join('');
  $('#owner').innerHTML=
  '<div class="ownerbar"><div><strong>Modo asesor</strong><span>Esta barra solo aparece cuando abres el simulador con tu cuenta; tus clientes no la ven y ven la versión resumida. Tus clientes ven solo las opciones que cumplen o que se pueden ajustar.</span>'+stale+'<label class="chk"><input type="checkbox" id="o-all"><span>Ver también las opciones que no cumplen</span></label></div><button type="button" class="btn" id="o-toggle" aria-expanded="false">Editar tasas</button></div>'+
  '<section class="card panel" id="o-panel" hidden><div><h3>Parámetros generales</h3><div class="grid-p">'+
  g('g-uvr','Valor UVR ($)',dnum(S.uvr),'Banco de la República, '+(S.uvrDate||'sin fecha')+'. Referencia, no afecta la cuota.')+
  g('g-infl','Inflación de largo plazo %',dnum(S.inflation),'Meta del Banco de la República; la proyección de corto plazo está cargada mes a mes')+
  g('g-ratio','Cuota máx. / ingreso %',dnum(S.ratio))+
  g('g-glob','Endeudamiento global máx. %',dnum(S.globalDebt),'Incluye la cuota nueva')+
  g('g-vida','Seguro de vida % mensual',dnum(S.vida),'Sobre el saldo')+
  g('g-hogar','Seguro hogar % mensual',dnum(S.hogar),'Sobre el valor del inmueble')+
  g('g-smmlv','SMMLV vigente ($)',group(S.smmlv),'Actualizar cada enero')+
  g('g-smmlvy','Año del SMMLV',S.smmlvYear)+
  g('g-viscity','Tope VIS municipios de la lista (SMMLV)',dnum(S.visCity),'Decreto 1607 de 2022')+
  g('g-visother','Tope VIS resto del país (SMMLV)',dnum(S.visOther))+
  g('g-cmin','Plazo mín. compra de cartera (años)',S.carteraMin)+g('g-cmax','Plazo máx. compra de cartera (años)',S.carteraMax)+
  '<div class="field"><label for="g-date">Fecha de las tasas</label><div class="inwrap"><input id="g-date" type="date" value="'+esc(S.updated)+'"></div></div>'+
  '<div class="field"><label for="g-adv">Tu nombre</label><div class="inwrap"><input id="g-adv" type="text" value="'+esc(S.advisor.name)+'"></div></div>'+
  '<div class="field"><label for="g-con">Contacto visible</label><div class="inwrap"><input id="g-con" type="text" value="'+esc(S.advisor.contact)+'"></div><small>Teléfono o correo</small></div>'+
  '</div><label class="chk"><input type="checkbox" id="g-ver"'+(S.verified?' checked':'')+'><span>Confirmo que las tasas de abajo son las vigentes en la cartelera de cada banco. Mientras no lo marques, los clientes ven el aviso de tasas de ejemplo.</span></label></div>'+
  '<div><h3>Costos de legalización (aproximados)</h3><div class="grid-p">'+COSTF.map(function(f){return g('c-'+f[0],f[1],dnum(S.costs[f[0]]));}).join('')+'</div></div>'+
  '<div><h3>Bancos y tasas</h3>'+banks+'</div>'+
  '<div class="savebar"><button type="button" class="btn" id="o-save">Guardar y publicar</button><span class="msg" id="o-msg"></span></div></section>';
  $('#o-toggle').addEventListener('click',function(){
    const p=$('#o-panel');p.hidden=!p.hidden;this.setAttribute('aria-expanded',String(!p.hidden));this.textContent=p.hidden?'Editar tasas':'Cerrar panel';
  });
  $('#o-all').addEventListener('change',function(){showAll=this.checked;update();});
  $('#o-save').addEventListener('click',save);
}
function collect(){
  const n=JSON.parse(JSON.stringify(S));
  const gv=function(id,d){const x=pnum($('#'+id).value);return isFinite(x)?x:d;};
  n.uvr=gv('g-uvr',S.uvr);n.inflation=gv('g-infl',S.inflation);n.ratio=gv('g-ratio',S.ratio);n.globalDebt=gv('g-glob',S.globalDebt);
  n.vida=gv('g-vida',S.vida);n.hogar=gv('g-hogar',S.hogar);
  n.smmlv=gv('g-smmlv',S.smmlv);n.smmlvYear=gv('g-smmlvy',S.smmlvYear);n.visCity=gv('g-viscity',S.visCity);n.visOther=gv('g-visother',S.visOther);n.carteraMin=gv('g-cmin',S.carteraMin);n.carteraMax=gv('g-cmax',S.carteraMax);
  n.updated=$('#g-date').value||S.updated;n.verified=$('#g-ver').checked;
  n.advisor={name:$('#g-adv').value.trim(),contact:$('#g-con').value.trim()};
  COSTF.forEach(function(f){n.costs[f[0]]=gv('c-'+f[0],S.costs[f[0]]);});
  n.banks.forEach(function(b,i){
    const oldName=b.name;
    b.name=$('#b'+i+'-name').value.trim()||b.name;
    if(b.name!==oldName){
      if(n.docs.banks&&n.docs.banks[oldName]){n.docs.banks[b.name]=n.docs.banks[oldName];delete n.docs.banks[oldName];}
      if(n.legal.banks&&n.legal.banks[oldName]){n.legal.banks[b.name]=n.legal.banks[oldName];delete n.legal.banks[oldName];}
    }
    b.maxAge=gv('b'+i+'-age',b.maxAge);b.maxTerm=gv('b'+i+'-term',b.maxTerm);
    const pol=Object.assign({},b.policy||{});
    POL.forEach(function(f){const v=pnum($('#b'+i+'-p-'+f[0]).value);pol[f[0]]=(isFinite(v)&&v>0)?v:0;});
    pol.uvrIndep=$('#b'+i+'-p-uvr').checked;pol.avaluoIva=$('#b'+i+'-p-iva').checked;pol.expRules=$('#b'+i+'-p-exp').checked;
    b.policy=pol;
    PR.forEach(function(pr){const k=pr[0];
      const r=pnum($('#b'+i+'-'+k+'-rate').value);
      b.products[k].rate=(isFinite(r)&&r>0)?r:null;
      if(k==='cartera'){const ru=pnum($('#b'+i+'-'+k+'-rateuvr').value);b.products[k].rateUvr=(isFinite(ru)&&ru>0)?ru:null;}
      b.products[k].ltv=gv('b'+i+'-'+k+'-ltv',b.products[k].ltv);
      if(k==='libre')b.products[k].maxMonths=gv('b'+i+'-'+k+'-maxm',b.products[k].maxMonths||84);
      b.products[k].ltvVis=gv('b'+i+'-'+k+'-ltvvis',b.products[k].ltvVis||b.products[k].ltv);
    });
  });
  return n;
}
async function save(){
  const msg=$('#o-msg'),btn=$('#o-save');
  msg.textContent='Publicando…';btn.disabled=true;
  try{
    const art=await window.claude.use('artifact');
    if(!art){msg.textContent='No tienes permiso para publicar cambios en esta página.';btn.disabled=false;return;}
    const html=buildDoc(collect());
    if(!html){msg.textContent='No se pudo preparar la página.';btn.disabled=false;return;}
    await art.publish(html);
    msg.textContent='Publicado. La página se recarga con los cambios.';
  }catch(e){
    msg.textContent=(e&&e.code==='conflict')?'Otra versión se publicó antes. La página se recarga con la última.':'No se pudo publicar. Intenta de nuevo.';
    btn.disabled=false;
  }
}

function showSwitch(){
  const w=$('#vsw');if(!w)return;
  w.innerHTML='<button type="button" class="vsw'+(ADV?' adv':'')+'" id="vsw-b" title="Cambiar entre la vista del asesor y la del cliente">'+I(ADV?'user':'search')+'<span>'+(ADV?'Vista asesor':'Vista cliente')+'</span><em>Cambiar</em></button>';
  $('#vsw-b').addEventListener('click',function(){ADV=!ADV;showSwitch();if(!ADV&&step===6)go(1);else update();});
  const sc=$('#st-comm');if(sc)sc.hidden=!ADV;const sn=document.querySelector('.steps');if(sn)sn.classList.toggle('six',!!ADV);
}
shell();
leadInit();
legalInit();
cmInit();
try{if(location.hash==='#asesor'){ADV=true;showSwitch();}}catch(e){}
update();
(async function(){
  try{
    if(!(window.claude&&window.claude.use))return;
    const u=await window.claude.use('user');
    if(u&&u.canEdit&&u.canEdit()){ADV=true;ownerUI();showSwitch();update();}

})();
